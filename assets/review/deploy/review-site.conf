# The proofreading site's Apache settings, shared by both of its sites: review.conf (http, port 80)
# includes this file, and certbot copies that Include line into review-le-ssl.conf (https, port 443).
# Change the site here, never in those two files. After a change run:
#   sudo apache2ctl configtest && sudo systemctl reload apache2

# HTTP/2 for this site alone (mod_http2, enabled in DEPLOY.md step 7); browsers that lack it use HTTP/1.1.
Protocols h2 http/1.1

# The page: plain files from web/.
DocumentRoot /srv/review/app/web
DirectoryIndex index.html
<Directory /srv/review/app/web>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# The API: waitress on 127.0.0.1:8087 (review.service). A stopped API answers 503 at once. waitress closes
# a connection idle for 30 s (server/prod.py, channel_timeout), so Apache stops using an idle one after 20 s.
ProxyRequests Off
ProxyPreserveHost On
ProxyPass        /api/ http://127.0.0.1:8087/api/ connectiontimeout=2 timeout=15 retry=0 ttl=20
ProxyPassReverse /api/ http://127.0.0.1:8087/api/

# Request bodies: 64 KiB on every path. Apache refuses a larger body itself.
LimitRequestBody 65536

# The admin routes never answer the internet. review.py reaches them through an SSH tunnel to waitress on
# 127.0.0.1:8087, which does not pass through Apache, so the admin token never crosses the internet. Apache
# refuses /api/admin/ at once, before it reads a body, and marks every request it passes on to the API with
# X-Review-Proxy, which the API's admin routes refuse too (server/app.py), should this block ever be lost.
<Location "/api/admin/">
    Require all denied
</Location>
RequestHeader set X-Review-Proxy "1"

# On every response, page or API.
Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Robots-Tag "noindex"
Header always set Strict-Transport-Security "max-age=31536000"

# The page and its code are checked on every visit; fonts are kept for 30 days.
<FilesMatch "\.(html|js|css|json|webmanifest)$">
    Header set Cache-Control "no-cache"
</FilesMatch>
<FilesMatch "\.(ttf|otf|woff2?)$">
    Header set Cache-Control "public, max-age=2592000"
</FilesMatch>
AddType font/ttf .ttf
AddType font/woff2 .woff2
AddType application/manifest+json .webmanifest
AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json font/ttf
