# Apache 2.4 site for the proofreading site (http, port 80).
# Install once as /etc/apache2/sites-available/review.conf and enable with: sudo a2ensite review
# The host name is set on the ServerName line only. certbot copies this block into
# review-le-ssl.conf for https and adds the redirect from http to https here, so this file is
# never copied again after certbot has run. Every other setting is in review-site.conf.
<VirtualHost *:80>
    ServerName review.laoegw.com
    Include /srv/review/app/deploy/review-site.conf
    ErrorLog ${APACHE_LOG_DIR}/review-error.log
    CustomLog ${APACHE_LOG_DIR}/review-access.log combined
</VirtualHost>
